---
# -----------------------------------------------------------------------------
# OpsBoard environment secrets
#
# Creates namespace-specific secrets for staging or production.
# Passwords are read from environment variables and never stored in Git.
# -----------------------------------------------------------------------------

- name: Configure OpsBoard environment secrets
  hosts: control_plane
  become: false
  gather_facts: false

  vars:
    opsboard_namespace_map:
      staging: opsboard-staging
      prod: opsboard-prod

    opsboard_password_env_map:
      staging: OPSBOARD_STAGING_POSTGRES_PASSWORD
      prod: OPSBOARD_PROD_POSTGRES_PASSWORD

  pre_tasks:
    - name: Validate requested environment
      ansible.builtin.assert:
        that:
          - opsboard_environment is defined
          - opsboard_environment in ['staging', 'prod']
        fail_msg: >-
          Set opsboard_environment to either staging or prod.

    - name: Set environment-specific secret variables
      ansible.builtin.set_fact:
        opsboard_namespace: "{{ opsboard_namespace_map[opsboard_environment] }}"
        opsboard_postgres_password: >-
          {{ lookup('env', opsboard_password_env_map[opsboard_environment]) }}
      no_log: true

  roles:
    - kubernetes_secrets

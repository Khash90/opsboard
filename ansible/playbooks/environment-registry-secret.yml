---
# -----------------------------------------------------------------------------
# OpsBoard environment registry secret
#
# Copies the existing local GitLab registry pull credential from the
# development namespace into staging or production.
#
# The credential itself is never printed or stored in Git.
# -----------------------------------------------------------------------------

- name: Configure OpsBoard registry pull secret
  hosts: control_plane
  become: false
  gather_facts: false

  vars:
    registry_source_namespace: opsboard

    opsboard_namespace_map:
      staging: opsboard-staging
      prod: opsboard-prod

  pre_tasks:
    - name: Validate requested environment
      ansible.builtin.assert:
        that:
          - opsboard_environment is defined
          - opsboard_environment in ['staging', 'prod']
        fail_msg: >-
          Set opsboard_environment to either staging or prod.

    - name: Set target namespace
      ansible.builtin.set_fact:
        opsboard_namespace: "{{ opsboard_namespace_map[opsboard_environment] }}"

  tasks:
    - name: Read development GitLab registry secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: gitlab-registry
        namespace: "{{ registry_source_namespace }}"
      register: registry_secret
      no_log: true

    - name: Validate source registry secret
      ansible.builtin.assert:
        that:
          - registry_secret.resources | length == 1
          - registry_secret.resources[0].data['.dockerconfigjson'] is defined
        fail_msg: >-
          The source gitlab-registry secret is missing or invalid.
      no_log: true

    - name: Create or update environment registry secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitlab-registry
            namespace: "{{ opsboard_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: >-
              {{ registry_secret.resources[0].data['.dockerconfigjson'] }}
      no_log: true

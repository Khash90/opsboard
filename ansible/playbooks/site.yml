# -----------------------------------------------------------------------------
# OpsBoard main Ansible playbook
#
# Applies the shared Linux baseline, prepares Kubernetes nodes, configures the
# container runtime, and installs administration tools where required.
# -----------------------------------------------------------------------------

- name: Apply the common Linux baseline
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

- name: Configure the Kubernetes container runtime
  hosts: all
  become: true
  gather_facts: true

  roles:
    - containerd

- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  gather_facts: true

  roles:
    - kubernetes_node

- name: Configure the Ansible control node
  hosts: control_plane
  become: true
  gather_facts: true

  roles:
    - terraform

# SPDX-License-Identifier: MIT-0

# -----------------------------------------------------------------------------
# OpsBoard main Ansible playbook
#
# Applies the shared Linux baseline, configures the container runtime, prepares
# Kubernetes nodes, installs Kubernetes packages, and installs administration
# tools only where they are required.
# -----------------------------------------------------------------------------

- name: Apply the common Linux baseline
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

- name: Configure the Kubernetes container runtime
  hosts: all
  become: true
  gather_facts: true

  roles:
    - containerd

- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  gather_facts: true

  roles:
    - kubernetes_node

- name: Install Kubernetes packages
  hosts: all
  become: true
  gather_facts: true

  roles:
    - kubernetes_packages

- name: Configure the Ansible control node
  hosts: control_plane
  become: true
  gather_facts: true

  roles:
    - terraform

# SPDX-License-Identifier: MIT-0

# -----------------------------------------------------------------------------
# OpsBoard main Ansible playbook
#
# Applies the shared Linux baseline, configures Kubernetes node components,
# and installs administration tools only where they are required.
# -----------------------------------------------------------------------------

- name: Apply the common Linux baseline
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

- name: Configure the Kubernetes container runtime
  hosts: all
  become: true
  gather_facts: true

  roles:
    - containerd

- name: Configure the Ansible control node
  hosts: control_plane
  become: true
  gather_facts: true

  roles:
    - terraform

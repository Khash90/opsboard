# SPDX-License-Identifier: MIT-0

# -----------------------------------------------------------------------------
# OpsBoard main Ansible playbook
#
# Applies the shared Linux baseline to every managed node and installs
# administration tools only on the Ansible control node.
# Additional roles will be added later for Kubernetes, container runtime,
# security, and observability configuration.
# -----------------------------------------------------------------------------

- name: Apply the common Linux baseline
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

- name: Configure the Ansible control node
  hosts: control_plane
  become: true
  gather_facts: true

  roles:
    - terraform

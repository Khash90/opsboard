# -----------------------------------------------------------------------------
# OpsBoard Kubernetes node role handlers
#
# Loads required kernel modules and reapplies sysctl settings only when their
# persistent configuration files change.
# -----------------------------------------------------------------------------

- name: Load Kubernetes kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop: "{{ kubernetes_kernel_modules }}"
  changed_when: true
  become: true

- name: Apply Kubernetes sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  become: true

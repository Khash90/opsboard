# SPDX-License-Identifier: MIT-0

# -----------------------------------------------------------------------------
# OpsBoard common role tasks
#
# Applies the shared Linux baseline required by every managed node.
# Package names are defined in defaults/main.yml so they can be overridden
# cleanly for future environments or projects.
# -----------------------------------------------------------------------------

- name: Install shared operating system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

---
# Install GitLab Runner from the official GitLab package repository.

- name: Install GitLab Runner repository prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Download GitLab Runner repository setup script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
    dest: /tmp/gitlab-runner-repository.sh
    mode: "0755"

- name: Configure GitLab Runner package repository
  ansible.builtin.command:
    cmd: /tmp/gitlab-runner-repository.sh
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
  become: true

- name: Install GitLab Runner
  ansible.builtin.apt:
    name: gitlab-runner
    state: present
    update_cache: true
  become: true

- name: Ensure GitLab Runner service is enabled and started
  ansible.builtin.systemd:
    name: gitlab-runner
    enabled: true
    state: started
  become: true

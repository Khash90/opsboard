---
# SPDX-License-Identifier: MIT-0

# -----------------------------------------------------------------------------
# OpsBoard Terraform role tasks
#
# Installs Terraform from HashiCorp's official signed APT repository.
# This role is intended to run only on the Ansible control node.
# -----------------------------------------------------------------------------

- name: Install packages required for the HashiCorp APT repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Download the HashiCorp repository signing key
  ansible.builtin.get_url:
    url: "{{ terraform_gpg_key_url }}"
    dest: /tmp/hashicorp-archive-keyring.asc
    mode: "0644"
  become: true

- name: Convert the HashiCorp signing key to GPG keyring format
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      --yes
      --output {{ terraform_gpg_key_path }}
      /tmp/hashicorp-archive-keyring.asc
  args:
    creates: "{{ terraform_gpg_key_path }}"
  become: true

- name: Configure the official HashiCorp APT repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types:
      - deb
    uris:
      - "{{ terraform_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    architectures:
      - amd64
    signed_by: "{{ terraform_gpg_key_path }}"
    state: present
    enabled: true
  become: true

- name: Install Terraform
  ansible.builtin.apt:
    name: "{{ terraform_package_name }}"
    state: "{{ terraform_package_state }}"
    update_cache: true
  become: true

- name: Verify Terraform installation
  ansible.builtin.command:
    cmd: terraform version
  register: terraform_version_output
  changed_when: false

- name: Display the installed Terraform version
  ansible.builtin.debug:
    var: terraform_version_output.stdout_lines

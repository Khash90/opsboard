# OpsBoard Loki configuration
# Day 16 - centralized logging
#
# Small single-node lab deployment:
# - Monolithic Loki
# - One replica
# - Local filesystem storage
# - Persistent local-path PVC
# - Authentication disabled because Loki is internal to the cluster

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  nodeSelector:
    kubernetes.io/hostname: ubuntuvm2

# Disable Simple Scalable components because this lab uses
# the Monolithic deployment mode.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Components unnecessary for this small monolithic lab.
gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

minio:
  enabled: false

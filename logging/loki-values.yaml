# OpsBoard Loki configuration
# Day 16/17 - centralized logging + log-based alerting
#
# Small single-node lab deployment:
# - Monolithic Loki
# - One Loki replica
# - Local filesystem storage
# - Persistent local-path PVC
# - Authentication disabled because Loki is internal to the cluster
# - Grafana Alloy collects Kubernetes pod logs
# - Loki evaluates application log alert rules
# - Alert notifications are forwarded to Alertmanager

deploymentMode: Monolithic


loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  # Loki's ruler runs inside the monolithic target=all process.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules

    rule_path: /tmp/loki/rules-temp

    alertmanager_url: >-
      http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093

    enable_alertmanager_v2: true
    enable_api: true

    evaluation_interval: 30s
    poll_interval: 30s


singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  nodeSelector:
    kubernetes.io/hostname: ubuntuvm2


# Distributed Loki components are disabled because this lab uses
# monolithic single-binary mode.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0


gateway:
  enabled: false


chunksCache:
  enabled: false


resultsCache:
  enabled: false


lokiCanary:
  enabled: false


test:
  enabled: false


minio:
  enabled: false


# ------------------------------------------------------------------
# Ruler configuration
# ------------------------------------------------------------------
#
# No standalone ruler workload is created.
#
# The singleBinary Loki process runs with:
#
#   -target=all
#
# which includes ruler functionality.
#
# Loki authentication is disabled, so the local tenant ID is "fake".
#
ruler:
  enabled: true

  # Keep this at zero in Monolithic mode.
  # A non-zero value would create a separate ruler workload and
  # conflict with the monolithic singleBinary deployment.
  replicas: 0

  # Declaring the tenant allows the singleBinary workload to mount
  # the expected local rules ConfigMap path.
  directories:
    fake: {}


# ------------------------------------------------------------------
# OpsBoard Loki alert rules
# ------------------------------------------------------------------
#
# The singleBinary workload expects:
#
#   ConfigMap: loki-single-binary-rules-fake
#
# mounted at:
#
#   /etc/loki/rules/fake
#
# Helm processes extraObjects through tpl, so Loki's {{ $labels.* }}
# templates must be escaped below. Helm writes them literally into
# the ConfigMap and Loki evaluates them later.
#
extraObjects:

  - apiVersion: v1
    kind: ConfigMap

    metadata:
      name: loki-single-binary-rules-fake
      namespace: logging

    data:
      opsboard-alerts.yaml: |
        groups:

          - name: opsboard.log.rules

            rules:

              # -------------------------------------------------------
              # OpsBoard application errors/warnings in Loki
              # -------------------------------------------------------
              #
              # Watches only the five core OpsBoard applications.
              #
              # The known harmless Redis startup warning is explicitly
              # excluded to avoid a false alert after VM/container boot.
              #
              - alert: OpsBoardLogErrors

                expr: |
                  sum by (app, pod, container) (
                    count_over_time(
                      {
                        namespace="opsboard",
                        app=~"vote|result|worker|redis|postgres"
                      }
                      |~ "(?i)error|warning|warn|exception|failed|failure|fatal|panic"
                      != "no config file specified, using the default config"
                      [2m]
                    )
                  ) > 0

                # Require the condition to persist so one transient
                # message does not immediately generate email.
                for: 1m

                labels:
                  severity: warning
                  namespace: opsboard
                  category: logs

                annotations:
                  summary: "OpsBoard application error detected in logs"

                  description: >-
                    Loki detected error/warning log activity from application
                    {{ "{{ $labels.app }}" }}, pod
                    {{ "{{ $labels.pod }}" }}, container
                    {{ "{{ $labels.container }}" }}.

                    Review the application's recent logs in Grafana/Loki and
                    investigate the underlying application, dependency,
                    configuration, or infrastructure issue.

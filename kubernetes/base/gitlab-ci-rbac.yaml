apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-ci-deployer
  namespace: opsboard

---
# ============================================================
# Development - read-only CI smoke-test access
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-ci-deployer
  namespace: opsboard

rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-ci-deployer
  namespace: opsboard

subjects:
  - kind: ServiceAccount
    name: gitlab-ci-deployer
    namespace: opsboard

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-ci-deployer

---

{{- if .Values.vote.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: opsboard

spec:
  replicas: {{ .Values.vote.replicaCount }}

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote
        app.kubernetes.io/name: vote
        app.kubernetes.io/part-of: opsboard

    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: vote
          image: "{{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}"
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.vote.service.port }}

          env:
            - name: REDIS_HOST
              value: {{ .Values.vote.redis.host | quote }}

            - name: REDIS_PORT
              value: {{ .Values.vote.redis.port | quote }}

            - name: RESULT_URL
              value: {{ .Values.vote.resultUrl | quote }}

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.vote.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.vote.readinessProbe.periodSeconds }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.vote.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.vote.livenessProbe.periodSeconds }}

          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false

---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: opsboard

spec:
  type: {{ .Values.vote.service.type }}

  selector:
    app: vote

  ports:
    - name: http
      port: {{ .Values.vote.service.port }}
      targetPort: http
      nodePort: {{ .Values.vote.service.nodePort }}

{{- end }}

# ============================================================
# OpsBoard Helm Chart - Staging Overrides
# ============================================================
#
# Staging reuses the common values from values.yaml and changes
# only settings that must differ inside the shared lab cluster.
#
# Application image tags are defined here so Staging can be
# promoted independently through the GitLab CI/CD workflow.
# ============================================================

worker:
  image:
    tag: "66069852"

vote:
  image:
    tag: "metrics-v3"

  resultUrl: http://127.0.0.1:8085

  service:
    type: NodePort
    port: 8080
    nodePort: 30082

result:
  image:
    tag: "66069852"

  service:
    type: NodePort
    port: 8080
    nodePort: 30083

# ============================================================
# OpsBoard Helm Chart - Default Values
# ============================================================
# This file defines the desired Kubernetes configuration for
# Redis, PostgreSQL, Worker, Vote, and Result.
#
# Argo CD reads these values from Git and compares them against
# the live Kubernetes cluster.
# ============================================================


# ============================================================
# Redis
# ============================================================

redis:
  enabled: true

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 6379

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10


# ============================================================
# PostgreSQL
# ============================================================

postgres:
  enabled: true

  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  replicaCount: 1

  database:
    user: postgres
    name: postgres

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10


# ============================================================
# Worker
# ============================================================
# Processes votes from Redis and stores results in PostgreSQL.
#
# The image tag is immutable and represents the currently
# approved GitOps release.
# ============================================================

worker:
  enabled: true

  image:
    repository: 10.0.2.5:5050/opsboard/opsboard/worker
    tag: "66069852"
    pullPolicy: IfNotPresent

  replicaCount: 1

  redis:
    host: redis

  postgres:
    host: db
    user: postgres
    database: postgres

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ============================================================
# Vote Application
# ============================================================
# Front-end service where users submit votes.
#
# Exposed through NodePort 30080 in the local lab.
# ============================================================

vote:
  enabled: true

  image:
    repository: 10.0.2.5:5050/opsboard/opsboard/vote
    tag: "metrics-v1"
    pullPolicy: IfNotPresent

  replicaCount: 1

  redis:
    host: redis
    port: 6379

  # Host-browser URL used by the Vote application to redirect
  # users to the Result application in the VirtualBox lab.
  resultUrl: http://127.0.0.1:8082

  service:
    type: NodePort
    port: 8080
    nodePort: 30080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10


# ============================================================
# Result Application
# ============================================================
# Displays the current voting results stored in PostgreSQL.
#
# Exposed through NodePort 30081 in the local lab.
# ============================================================

result:
  enabled: true

  image:
    repository: 10.0.2.5:5050/opsboard/opsboard/result
    tag: "66069852"
    pullPolicy: IfNotPresent

  replicaCount: 1

  postgres:
    host: db
    user: postgres
    database: postgres

  service:
    type: NodePort
    port: 8080
    nodePort: 30081

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5

  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10

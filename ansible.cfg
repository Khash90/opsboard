# -----------------------------------------------------------------------------
# OpsBoard Ansible configuration
#
# Keeps project-specific Ansible behavior inside the repository so commands
# behave consistently for every developer and environment.
# -----------------------------------------------------------------------------

[defaults]

# Development inventory used by default in the current VirtualBox lab.
inventory = ansible/inventories/dev/hosts.yml

# Directory containing reusable OpsBoard roles.
roles_path = ansible/roles

# Keep output readable while still showing useful execution details.
stdout_callback = default
display_skipped_hosts = false

# Verify remote host identities using ~/.ssh/known_hosts.
# This should remain enabled for secure SSH connections.
host_key_checking = true

# Prevent creation of retry files inside the Git repository.
retry_files_enabled = false

[privilege_escalation]

# Use sudo when a task or play requests privilege escalation.
become_method = sudo
become_ask_pass = false

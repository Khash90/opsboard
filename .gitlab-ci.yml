stages:
  - validate
  - build
  - publish
  - smoke


# ---------------------------------------------------------
# Validate
# ---------------------------------------------------------
# Basic runner/environment validation.
# This remains part of the normal CI pipeline.

validate_pipeline:
  stage: validate
  script:
    - 'echo "Validating OpsBoard CI environment"'
    - 'echo "Runner host: $(hostname)"'
    - 'echo "Runner user: $(whoami)"'
    - 'docker version'
    - 'echo "Validation completed successfully"'


# ---------------------------------------------------------
# Registry Authentication Check
# ---------------------------------------------------------
# Manual diagnostic job.
# Verifies GitLab Container Registry credentials only.

registry_auth_check:
  stage: validate
  when: manual
  allow_failure: true
  script:
    - 'echo "Checking GitLab Container Registry authentication"'
    - 'test -n "$CI_REGISTRY"'
    - 'test -n "$CI_REGISTRY_USER"'
    - 'test -n "$CI_REGISTRY_PASSWORD"'
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - 'docker logout "$CI_REGISTRY"'
    - 'echo "Registry authentication verified successfully"'


# ---------------------------------------------------------
# Kubernetes Authentication Check
# ---------------------------------------------------------
# Manual diagnostic job.
#
# Kubernetes credentials are temporarily retained because the
# smoke-test job still performs read-only rollout checks.
#
# Argo CD now owns deployment/reconciliation of OpsBoard.
# GitLab CI must not directly deploy or roll back the release.

kubernetes_auth_check:
  stage: validate
  when: manual
  allow_failure: true
  script:
    - 'echo "Checking Kubernetes authentication"'
    - 'test -f "$KUBE_CONFIG"'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl get pods -n opsboard'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl auth can-i get deployments -n opsboard'
    - 'echo "Kubernetes authentication verified successfully"'


# ---------------------------------------------------------
# Build Vote
# ---------------------------------------------------------
# Safe demo build.
# Builds locally on the self-hosted runner but does not publish.

build_vote:
  stage: build
  when: manual
  allow_failure: true
  script:
    - 'echo "Building OpsBoard vote image"'
    - 'docker build -t opsboard-vote:ci-demo app/vote'
    - 'docker image inspect opsboard-vote:ci-demo >/dev/null'
    - 'echo "Vote image built successfully"'


# ---------------------------------------------------------
# Build Result
# ---------------------------------------------------------
# Safe demo build.
# Builds locally on the self-hosted runner but does not publish.

build_result:
  stage: build
  when: manual
  allow_failure: true
  script:
    - 'echo "Building OpsBoard result image"'
    - 'docker build -t opsboard-result:ci-demo app/result'
    - 'docker image inspect opsboard-result:ci-demo >/dev/null'
    - 'echo "Result image built successfully"'


# ---------------------------------------------------------
# Build Worker
# ---------------------------------------------------------
# Safe demo build.
# Builds locally on the self-hosted runner but does not publish.

build_worker:
  stage: build
  when: manual
  allow_failure: true
  script:
    - 'echo "Building OpsBoard worker image"'
    - 'docker build -t opsboard-worker:ci-demo app/worker'
    - 'docker image inspect opsboard-worker:ci-demo >/dev/null'
    - 'echo "Worker image built successfully"'


# ---------------------------------------------------------
# Publish Vote
# ---------------------------------------------------------
# Builds and pushes an immutable image tag based on the
# Git commit SHA.
#
# Publishing is CI responsibility.
# Deployment is Argo CD responsibility.

publish_vote:
  stage: publish
  when: manual
  allow_failure: true
  script:
    - 'echo "Publishing OpsBoard vote image"'
    - 'test -n "$CI_REGISTRY"'
    - 'test -n "$CI_REGISTRY_USER"'
    - 'test -n "$CI_REGISTRY_PASSWORD"'
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - 'docker build -t "$CI_REGISTRY_IMAGE/vote:$CI_COMMIT_SHORT_SHA" app/vote'
    - 'docker push "$CI_REGISTRY_IMAGE/vote:$CI_COMMIT_SHORT_SHA"'
    - 'docker logout "$CI_REGISTRY"'
    - 'echo "Published vote image: $CI_REGISTRY_IMAGE/vote:$CI_COMMIT_SHORT_SHA"'


# ---------------------------------------------------------
# Publish Result
# ---------------------------------------------------------

publish_result:
  stage: publish
  when: manual
  allow_failure: true
  script:
    - 'echo "Publishing OpsBoard result image"'
    - 'test -n "$CI_REGISTRY"'
    - 'test -n "$CI_REGISTRY_USER"'
    - 'test -n "$CI_REGISTRY_PASSWORD"'
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - 'docker build -t "$CI_REGISTRY_IMAGE/result:$CI_COMMIT_SHORT_SHA" app/result'
    - 'docker push "$CI_REGISTRY_IMAGE/result:$CI_COMMIT_SHORT_SHA"'
    - 'docker logout "$CI_REGISTRY"'
    - 'echo "Published result image: $CI_REGISTRY_IMAGE/result:$CI_COMMIT_SHORT_SHA"'


# ---------------------------------------------------------
# Publish Worker
# ---------------------------------------------------------

publish_worker:
  stage: publish
  when: manual
  allow_failure: true
  script:
    - 'echo "Publishing OpsBoard worker image"'
    - 'test -n "$CI_REGISTRY"'
    - 'test -n "$CI_REGISTRY_USER"'
    - 'test -n "$CI_REGISTRY_PASSWORD"'
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
    - 'docker build -t "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA" app/worker'
    - 'docker push "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA"'
    - 'docker logout "$CI_REGISTRY"'
    - 'echo "Published worker image: $CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA"'


# ---------------------------------------------------------
# Smoke Test Development
# ---------------------------------------------------------
# Read-only verification against the live Kubernetes cluster.
#
# This job does not deploy, patch, roll back, or mutate workloads.
# Argo CD is the single deployment/reconciliation authority.

smoke_test_dev:
  stage: smoke
  when: manual
  allow_failure: true
  environment:
    name: dev
  script:
    - 'echo "Running OpsBoard dev smoke tests"'
    - 'test -f "$KUBE_CONFIG"'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl rollout status deployment/vote -n opsboard --timeout=60s'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl rollout status deployment/result -n opsboard --timeout=60s'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl rollout status deployment/worker -n opsboard --timeout=60s'
    - 'KUBECONFIG="$KUBE_CONFIG" kubectl get pods -n opsboard'
    - 'echo "OpsBoard dev smoke tests passed"'

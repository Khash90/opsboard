apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsboard
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Khash90/opsboard.git
    targetRevision: main
    path: helm/opsboard

  destination:
    server: https://kubernetes.default.svc
    namespace: opsboard

  syncPolicy: {}

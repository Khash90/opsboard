apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsboard-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Khash90/opsboard.git
    targetRevision: main
    path: helm/opsboard
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: opsboard-staging

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

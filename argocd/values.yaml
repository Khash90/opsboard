# OpsBoard Argo CD Helm values
# Development/lab configuration.

global:
  # Argo CD workloads should run only on Linux nodes.
  # VM1's control-plane NoSchedule taint naturally keeps these
  # workloads on the worker node without hard-coding a hostname.
  nodeSelector:
    kubernetes.io/os: linux

  # Do not allow Argo CD workloads to tolerate the control-plane taint.
  tolerations: []

# Dex provides external SSO integration.
# It is not needed yet in the local development lab.
dex:
  enabled: false

server:
  # Keep the Argo CD API/UI internal to the cluster.
  # We access it through kubectl port-forward in the lab.
  service:
    type: ClusterIP

repoServer:
  # The repo-server performs Git fetches and manifest generation.
  # Give it guaranteed baseline resources so it is not starved
  # on the constrained worker VM.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # The default 1-second probe timeout has been too aggressive
  # in this lab and caused repeated repo-server restarts.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
